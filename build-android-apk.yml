name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Signed Field-Force-Connect.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Flutter Android Project
        working-directory: ./mobile_app
        run: |
          flutter config --no-analytics
          flutter create . --project-name field_force_connect --org com.fieldforce --platforms android
          flutter pub get

      - name: Build Signed Release APK (V1 + V2 Signature)
        working-directory: ./mobile_app
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../Field-Force-Connect.apk

      - name: Upload Field-Force-Connect.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Field-Force-Connect-APK
          path: ./Field-Force-Connect.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (Direct Phone Download URL)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Field Force Connect Native Android APK (Latest)"
          body: |
            ### Field Force Connect — Native Android APK (`com.fieldforce.connect`)
            - **Direct Phone Install**: Download **`Field-Force-Connect.apk`** below on your Android phone and tap to install.
            - **Google Sheets Multi-Tab Sync**: Automatically routes Distributor Visits, Retailer Visits, Farmer Visits, Product Demonstrations, Farmer Meetings, and Field Days to their respective sheets.
            - **Google Drive Photo Links**: Uploads camera photos directly to Google Drive and populates `Photo_URLs`.
          files: ./Field-Force-Connect.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
